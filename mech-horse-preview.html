<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Mechanical Horse — Gallop</title>
<style>
  html, body { margin: 0; height: 100%; background: #121418; color: #e8e6e1; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 20px; bottom: 18px; right: 20px;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    font-size: 13px; letter-spacing: .02em;
    pointer-events: none;
  }
  #hud b { font-weight: 600; }
  #status { opacity: .85; }
  label { pointer-events: auto; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  button {
    pointer-events: auto; cursor: pointer;
    background: #2a2e36; color: inherit; border: 1px solid #4a5160;
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  button:hover { background: #353b46; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <span id="status">Caricamento del cavallo…</span>
  <button id="play" type="button" disabled>Pausa</button>
  <label><input id="arms" type="checkbox" /> braccia del cavaliere</label>
  <span>trascina per ruotare · scroll per zoom</span>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const statusEl = document.getElementById("status");
const playBtn = document.getElementById("play");
const armsBox = document.getElementById("arms");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a1f);
scene.fog = new THREE.Fog(0x171a1f, 8, 18);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 50);
camera.position.set(2.6, 1.15, 2.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.update();

scene.add(new THREE.HemisphereLight(0xfff4e5, 0x1c2430, 0.85));
const key = new THREE.DirectionalLight(0xfff7ee, 2.4);
key.position.set(4, 7, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x9eb4ff, 0.55)).position.set(-5, 2, -3);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.92, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const clock = new THREE.Clock();
let mixer, gallop, playing = true;
const armMeshes = [];

playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "Pausa" : "Play";
});
armsBox.addEventListener("change", () => {
  for (const m of armMeshes) m.visible = armsBox.checked;
});

const loader = new GLTFLoader();
loader.load(
  "Assets/Resources/Elderboom/Mounts/MechHorse_Rider.glb",
  (gltf) => {
    const root = gltf.scene;
    root.traverse((obj) => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
        if (obj.name === "RiderArms" || obj.parent?.name === "RiderArms") armMeshes.push(obj);
      }
    });
    for (const m of armMeshes) m.visible = false;
    scene.add(root);

    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    controls.target.set(center.x, center.y * 0.92, center.z);
    const dist = Math.max(size.x, size.y, size.z) * 1.7;
    camera.position.set(center.x + dist * 0.72, center.y + dist * 0.28, center.z + dist * 0.72);
    controls.update();

    mixer = new THREE.AnimationMixer(root);
    const clip = THREE.AnimationClip.findByName(gltf.animations, "Gallop") || gltf.animations[0];
    gallop = mixer.clipAction(clip);
    gallop.setLoop(THREE.LoopRepeat, Infinity);
    gallop.play();

    const dur = clip.duration.toFixed(2);
    statusEl.innerHTML = `<b>Gallop</b> · ${clip.tracks.length / 3 | 0} ossa · ciclo ${dur}s · MechHorse_Rider`;
    playBtn.disabled = false;
    window.__horse = { mixer, clip, setTime: (t) => mixer.setTime(t), pause: () => { playing = false; } };
    window.__ready = true;
  },
  (ev) => {
    if (ev.total) statusEl.textContent = `Caricamento… ${Math.round(100 * ev.loaded / ev.total)}%`;
  },
  (err) => {
    console.error(err);
    statusEl.textContent = "Errore nel caricamento del modello.";
    window.__error = String(err);
  }
);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function frame() {
  requestAnimationFrame(frame);
  const dt = clock.getDelta();
  if (mixer && playing) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
